<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YT Transcript</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 span { color: #38bdf8; }
  p.sub { color: #94a3b8; margin: 0 0 20px; font-size: 14px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
  label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 14px; }
  select { padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; font-size: 14px; cursor: pointer; }
  button.primary { background: #0284c7; color: #fff; font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #334155; color: #e2e8f0; }
  button.ghost:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #status { margin-top: 14px; font-size: 13px; min-height: 18px; color: #94a3b8; }
  #status.err { color: #f87171; }
  #status.ok { color: #4ade80; }
  #meta { font-size: 13px; color: #94a3b8; margin: 14px 0 8px; }
  #meta b { color: #e2e8f0; }
  #out { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 16px; max-height: 52vh; overflow: auto; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
  #out .ts { color: #38bdf8; }
  #tools { margin-top: 16px; font-size: 12px; color: #64748b; }
  #tools b { color: #94a3b8; }
  .hint { font-size: 12px; color: #64748b; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>YT <span>Transcript</span></h1>
  <p class="sub">Paste a YouTube link, get the full transcript. Captions first — Whisper when there are none.</p>

  <div class="card">
    <label for="url">YouTube video link</label>
    <div class="row">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false" />
      <select id="lang" title="Caption language">
        <option value="auto">Auto (English first)</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="pt">Português</option>
      </select>
    </div>
    <div class="actions">
      <button id="btnFetch" class="primary">Get transcript</button>
      <button id="btnWhisper" class="ghost">Transcribe audio (Whisper)</button>
      <button id="btnCopy" class="ghost" disabled>Copy</button>
      <button id="btnSave" class="ghost" disabled>Save .md</button>
    </div>
    <div id="status"></div>
    <div class="hint">Captions are instant and need nothing installed. Whisper downloads the audio and transcribes it locally — it needs yt-dlp, ffmpeg and whisper.cpp (see below).</div>
  </div>

  <div id="meta"></div>
  <div id="out" hidden></div>

  <div id="tools">Checking tools…</div>
</div>

<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
let current = null; // { title, markdown, fullText, videoId }

function setStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = kind || "";
}
function setBusy(busy) {
  $("btnFetch").disabled = busy;
  $("btnWhisper").disabled = busy;
}
function fmtTs(secs) {
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function showTranscript(t, sourceLabel) {
  window.__lastTranscript = t;
  current = {
    title: t.title || "YouTube transcript",
    videoId: t.videoId,
    fullText: t.fullText,
    markdown: null,
  };
  $("meta").innerHTML = "<b>" + escapeHtml(t.title || "") + "</b> · " +
    t.wordCount.toLocaleString() + " words · " +
    (t.isAutoGenerated ? "auto-generated captions" : "manual captions") +
    " · " + escapeHtml(t.languageName || t.languageCode);
  const out = $("out");
  out.hidden = false;
  out.innerHTML = "";
  t.segments.forEach((seg) => {
    const line = document.createElement("div");
    const ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = "[" + fmtTs(seg.startSecs) + "] ";
    line.appendChild(ts);
    line.appendChild(document.createTextNode(seg.text));
    out.appendChild(line);
  });
  $("btnCopy").disabled = false;
  $("btnSave").disabled = false;
  setStatus("Done — " + sourceLabel + ".", "ok");
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function buildMarkdown(t) {
  const url = $("url").value.trim();
  let md = "# " + (t.title || "YouTube transcript") + "\n";
  md += "# " + url + "\n";
  md += "# source: " + (t.isAutoGenerated ? "auto-generated captions" : "manual captions") +
    " | " + t.wordCount + " words\n\n";
  t.segments.forEach((seg) => { md += "[" + fmtTs(seg.startSecs) + "] " + seg.text + "\n"; });
  return md;
}

$("btnFetch").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) { setStatus("Paste a YouTube link first.", "err"); return; }
  setBusy(true);
  setStatus("Fetching captions…");
  try {
    const t = await invoke("fetch_transcript", { url, lang: $("lang").value });
    showTranscript(t, "captions");
  } catch (e) {
    setStatus(String(e), "err");
  } finally { setBusy(false); }
});

$("btnWhisper").addEventListener("click", async () => {
  const url = $("url").value.trim();
  if (!url) { setStatus("Paste a YouTube link first.", "err"); return; }
  setBusy(true);
  setStatus("Downloading audio and transcribing with Whisper — this takes a few minutes…");
  try {
    const t = await invoke("transcribe_audio", { url, lang: $("lang").value });
    showTranscript(t, "Whisper (tiny model)");
  } catch (e) {
    setStatus(String(e), "err");
  } finally { setBusy(false); }
});

$("btnCopy").addEventListener("click", async () => {
  if (!current) return;
  try {
    await navigator.clipboard.writeText(current.fullText);
    setStatus("Copied to clipboard.", "ok");
  } catch (e) { setStatus("Copy failed: " + e, "err"); }
});

$("btnSave").addEventListener("click", async () => {
  if (!current) return;
  // Rebuild markdown from the last transcript shown.
  const t = window.__lastTranscript;
  if (!t) return;
  const safe = (t.title || "transcript").replace(/[^a-zA-Z0-9-_ ]/g, "").trim().replace(/\s+/g, "-").slice(0, 80) || "transcript";
  try {
    const saved = await invoke("save_transcript", { content: buildMarkdown(t), defaultName: safe + "-transcript.md" });
    setStatus(saved ? "Saved: " + saved : "Save cancelled.", saved ? "ok" : "");
  } catch (e) { setStatus("Save failed: " + e, "err"); }
});

async function refreshTools() {
  try {
    const s = await invoke("check_tools");
    const mark = (ok) => ok ? "✓" : "✗";
    $("tools").innerHTML = "<b>Whisper fallback tools:</b> yt-dlp " + mark(s.ytDlp) +
      " · ffmpeg " + mark(s.ffmpeg) + " · whisper.cpp " + mark(s.whisper) +
      " — install the missing ones (or drop the .exe files next to the app) to enable audio transcription.";
  } catch (e) {
    $("tools").textContent = "";
  }
}
refreshTools();
</script>
</body>
</html>
