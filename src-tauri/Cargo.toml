[package]
name = "yt-transcript"
version = "0.1.0"
description = "Small Tauri Windows app: fetch a YouTube video's transcript from captions, or transcribe its audio with Whisper when there are no captions."
authors = ["Soufian El Habibe"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "yt_transcript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
